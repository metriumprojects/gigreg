name: Build iOS & Deploy to TestFlight

on:
  workflow_dispatch: # Manual trigger from the GitHub Actions UI
  push:
    branches:
      - master
    paths:
      - 'gigreg/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-deploy-ios:
    # Apple requires Xcode 26 / iOS 26 SDK for uploads since 28 Apr 2026
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          node --version || true
          ruby --version

      - name: Verify required secrets
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_DIST_PRIVATE_KEY: ${{ secrets.IOS_DIST_PRIVATE_KEY }}
        run: |
          missing=0
          for v in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY IOS_DIST_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret: $v"; missing=1; fi
          done
          exit $missing

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gigreg/package-lock.json

      - name: Install Node dependencies
        working-directory: gigreg
        run: npm ci

      # gigreg/.env is git-ignored, so production values must be provided here.
      # Without them the app falls back to http://localhost:5001 and cannot reach the backend.
      - name: Build web application
        working-directory: gigreg
        env:
          VITE_API_URL: https://gigreg-backend.onrender.com/api
          VITE_SOCKET_URL: https://gigreg-backend.onrender.com
          VITE_STRIPE_PUBLIC_KEY: pk_test_51U0o0ALvi6WtcqJQM9brltbAOIsuQK8QMKfchm1SuAQcdpF4cm66f34LtqzpHW0PgkWCJgdMMGim5i8XL44qCMgN00raojl0R4
        run: npm run build

      - name: Install Fastlane & CocoaPods (if not preinstalled)
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          command -v pod >/dev/null || brew install cocoapods
          fastlane --version
          pod --version

      - name: Sync Capacitor iOS
        working-directory: gigreg
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: gigreg/ios/App
        run: pod install --repo-update

      - name: Prepare signing files
        env:
          IOS_DIST_PRIVATE_KEY: ${{ secrets.IOS_DIST_PRIVATE_KEY }}
        run: |
          echo "$IOS_DIST_PRIVATE_KEY" > "$RUNNER_TEMP/dist.key"
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          P12_PASS=$(openssl rand -hex 16)
          echo "IOS_DIST_P12_PASSWORD=$P12_PASS" >> $GITHUB_ENV
          
          # Force legacy 3DES/SHA1 cipher suite required by macOS Security.framework
          openssl pkcs12 -export -legacy \
            -inkey "$RUNNER_TEMP/dist.key" \
            -in gigreg/ios/App/fastlane/dist.pem \
            -out "$RUNNER_TEMP/dist.p12" \
            -name "GigMake Apple Distribution" \
            -passout "pass:$P12_PASS"

          # Verify file exists and is non-empty
          test -s "$RUNNER_TEMP/dist.p12" || { echo "::error::Failed to generate dist.p12"; exit 1; }

          echo "IOS_DIST_P12_PATH=$RUNNER_TEMP/dist.p12" >> $GITHUB_ENV
          echo "APPLE_WWDR_CERT_PATH=$RUNNER_TEMP/AppleWWDRCAG3.cer" >> $GITHUB_ENV
          ls -la "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/AppleWWDRCAG3.cer"

      - name: Build IPA & Upload to TestFlight
        working-directory: gigreg/ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          IOS_DIST_P12_PASSWORD: ${{ env.IOS_DIST_P12_PASSWORD }}
          IOS_DIST_P12_PATH: ${{ env.IOS_DIST_P12_PATH }}
          APPLE_WWDR_CERT_PATH: ${{ env.APPLE_WWDR_CERT_PATH }}
        run: fastlane beta

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/dist.key"

      - name: Upload IPA Artifact to GitHub
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GigMake-iOS-IPA
          path: gigreg/ios/App/build/GigMake.ipa
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-build-logs
          path: ~/Library/Logs/gym
          if-no-files-found: ignore
